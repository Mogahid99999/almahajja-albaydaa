plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.storeupdate'
version = '0.1.0'

android {
  namespace "expo.modules.storeupdate"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // Google Play In-App Updates (the official way to learn that Play has a newer build).
  implementation 'com.google.android.play:app-update:2.1.0'
}
