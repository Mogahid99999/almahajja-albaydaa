# /opt/almahajja-go/docker-compose.yml — go.almahajja.app, the «البث المباشر» share-link site
# (PLAN_LIVE_V23 §9.3, D8): the /live/{code} fallback page + /.well-known App Links / Universal Links files.
#
# SHARED VPS rules (same as /opt/almahajja-live): our stuff only under /opt/almahajja-*, on our own
# external network almahajja_net (owned by /opt/almahajja-admin), a project-unique service name, and
# NO host ports — the Cloudflare Tunnel routes go.almahajja.app → http://almahajja-go:80.
# Never touch lims-proxy-1 / certbot / cpanel_net.
#
# public/config.js is generated per environment and is NOT in git (see README.md).
name: almahajja-go

services:
  almahajja-go:
    # Pin the exact patch tag at deploy time (docker image ls / hub), like the live stack.
    image: nginx:1.28-alpine
    container_name: almahajja-go
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/usr/share/nginx/html:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 60s
      timeout: 5s
      retries: 3
    cpus: 0.25
    mem_limit: 64m
    cpu_shares: 256       # LIMS (default 1024) wins under contention
    networks: [almahajja_net]

networks:
  almahajja_net:
    external: true
    name: almahajja_net
