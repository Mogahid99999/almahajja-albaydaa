# /opt/almahajja-go/nginx.conf — go.almahajja.app (PLAN_LIVE_V23 §9.3, D8).
# Mounted as /etc/nginx/conf.d/default.conf in the almahajja-go container. HTTP only:
# TLS terminates at Cloudflare; the tunnel reaches us as http://almahajja-go:80 on almahajja_net.
#
# NOTE: nginx drops server-level add_header in any location that has its own add_header,
# so locations below never use add_header (caching goes through `expires`).

server {
    listen 80 default_server;
    server_name go.almahajja.app _;

    root /usr/share/nginx/html;
    charset utf-8;
    charset_types text/css application/javascript application/json;
    server_tokens off;
    absolute_redirect off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://*.supabase.co; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

    # Android App Links (assetlinks.json) + iOS Universal Links (AASA): 200, JSON, no redirect.
    location = /.well-known/assetlinks.json {
        default_type application/json;
        expires 1h;
        try_files $uri =404;
    }
    location = /.well-known/apple-app-site-association {
        types { }
        default_type application/json;
        expires 1h;
        try_files $uri =404;
    }

    # The share link: /live/{code} → the static fallback page (it reads the code itself).
    location ~ ^/live/[^/]+/?$ {
        expires -1;
        try_files /live.html =404;
    }

    # Per-environment config: always fresh after a redeploy.
    location = /config.js {
        expires -1;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location = / {
        return 302 https://almahajja.app/;
    }

    location / {
        expires 1d;
        try_files $uri =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
